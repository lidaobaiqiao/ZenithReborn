<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>泰拉瑞亚原版特效素材浏览</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font:15px "Microsoft YaHei",sans-serif;color:#e7eef6;background:#111922}header{padding:26px 28px 18px;background:#1a2836;border-bottom:1px solid #344659}h1{margin:0 0 8px;font-size:23px}header p{margin:5px 0;color:#b7c5d2;line-height:1.7}.controls{position:sticky;top:0;z-index:2;padding:12px 24px;display:flex;gap:10px;flex-wrap:wrap;background:#17232f;border-bottom:1px solid #344659}input,select,button{font:inherit;color:#edf6ff;background:#233748;border:1px solid #52677b;border-radius:6px;padding:8px 11px}input{min-width:260px;flex:1}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}main{padding:18px 24px}.status{color:#b8cad9;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.card{background:#1d2b38;border:1px solid #344b5d;border-radius:7px;overflow:hidden;min-width:0}.preview{height:132px;display:flex;align-items:center;justify-content:center;background-color:#25303b;background-image:linear-gradient(45deg,#31404c 25%,transparent 25%),linear-gradient(-45deg,#31404c 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#31404c 75%),linear-gradient(-45deg,transparent 75%,#31404c 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}.preview img{max-width:118px;max-height:118px;image-rendering:pixelated}.data{padding:8px;font-size:12px;overflow-wrap:anywhere;line-height:1.5}.data strong{font-size:14px;color:#fff}.alias{color:#bdd4e2}.tag{color:#f0d58f}.pages{display:flex;gap:12px;align-items:center;justify-content:center;margin:18px 0}.notice{color:#9fb3c3;font-size:13px}a{color:#aad9ff}footer{padding:0 24px 20px;color:#9caebd;font-size:13px}
</style></head><body><header><h1>泰拉瑞亚 · 原版特效素材浏览</h1><p>从本机 Terraria 原版安装文件解包。输入编号、英文资源名或“星辰、神圣、剑与斩击、光束、火焰、冰雪、爆炸、魔法”查找；点击图片查看原尺寸。</p><p>这里展示原始贴图，不代表游戏中的完整动画、着色、运动或最终效果。碎片与辉光分类也包含非战斗用途；中文主题仅按英文标识初步匹配，未命中的素材仍可按类别和编号浏览。</p></header>
<div class="controls"><input id="q" placeholder="搜索编号、名称或主题" aria-label="搜索"><select id="category" aria-label="分类"></select><select id="amount" aria-label="每页数量"><option>100</option><option>200</option><option>400</option></select><button id="reset">清除筛选</button></div>
<main><p class="status" id="status"></p><div class="grid" id="grid"></div><div class="pages"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></div><p class="notice">粒子分类是从 Dust 图集裁出的三种 8×8 贴图，并排预览并不代表连续动画。原始图集与原尺寸文件都可以点击查看。</p></main><footer>资源来自本机游戏，仅作为本地项目素材整理。PNG 保留透明通道；各图在 Images 或 DustByID 目录中。</footer>
<script src="catalog.js"></script><script>
const all=window.VANILLA_VFX||[],q=document.querySelector('#q'),category=document.querySelector('#category'),amount=document.querySelector('#amount'),grid=document.querySelector('#grid'),status=document.querySelector('#status'),pageLabel=document.querySelector('#page'),prev=document.querySelector('#prev'),next=document.querySelector('#next');let page=0,found=[];
const names=['全部',...new Set(all.map(x=>x.c))];for(const name of names){const o=document.createElement('option');o.value=name;o.textContent=name;category.appendChild(o)}
function element(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text)e.textContent=text;return e}
function filter(){const terms=q.value.trim().toLowerCase().split(/\s+/).filter(Boolean);found=all.filter(x=>(category.value==='全部'||x.c===category.value)&&terms.every(t=>(x.n+' '+x.a+' '+x.t+' '+x.c).toLowerCase().includes(t)));page=0;render()}
function render(){const size=Number(amount.value),pages=Math.max(1,Math.ceil(found.length/size));page=Math.min(page,pages-1);grid.replaceChildren();for(const x of found.slice(page*size,(page+1)*size)){const card=element('article','card'),a=element('a','preview');a.href=x.p;a.target='_blank';a.title='查看原图';const img=document.createElement('img');img.src=x.s;img.loading='lazy';img.alt=x.n;a.append(img);const data=element('div','data');data.append(element('strong','',x.n),element('div','alias',x.a||'未映射英文名称'),element('div','tag',x.t||' '),element('div','',x.c+' · '+x.w+'×'+x.h));card.append(a,data);grid.append(card)}status.textContent='共 '+all.length+' 项，当前筛选 '+found.length+' 项';pageLabel.textContent='第 '+(page+1)+' / '+pages+' 页';prev.disabled=page===0;next.disabled=page>=pages-1}
q.addEventListener('input',filter);category.addEventListener('change',filter);amount.addEventListener('change',filter);prev.onclick=()=>{page--;render();window.scrollTo(0,0)};next.onclick=()=>{page++;render();window.scrollTo(0,0)};document.querySelector('#reset').onclick=()=>{q.value='';category.value='全部';filter()};filter();
</script></body></html>
